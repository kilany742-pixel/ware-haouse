<!DOCTYPE html>

    }
    #app h1,#app h2,#app h3{font-family:"Cairo",sans-serif;margin:0;line-height:1.3}
    #app .num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
    #app button{font-family:inherit;cursor:pointer}
    #app input,#app select,#app textarea{font-family:inherit}

    #app .top .sub{font-size:12px;opacity:.72;margin-top:2px}
    #app .stamp{border:1px dashed rgba(255,255,255,.45);border-radius:8px;padding:6px 12px;font-size:12px;text-align:center}
    #app .stamp b{display:block;font-size:17px;font-family:"IBM Plex Mono",monospace}
    #app .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
    #app .tab{background:transparent;border:1px solid var(--line);color:var(--ink-soft);padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:500}
    #app .tab:hover{border-color:var(--indigo);color:var(--indigo)}
    #app .tab.on{background:var(--ink);border-color:var(--ink);color:#fff}

    #app .btn.danger{background:var(--warn)} #app .btn.danger:hover{background:#8a2b19}

    #app .dist{margin-bottom:14px} #app .dist:last-child{margin-bottom:0}
    #app .dist-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:5px;gap:10px}

    #app .dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-left:4px;vertical-align:-1px}

    #picker .pk-row .q{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--indigo);flex-shrink:0}

    @media (max-width:560px){

  <div id="picker"></div>
</div>

  async function initFirebase(cfg) {
    const [appMod, fsMod] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js'),

    const app = appMod.initializeApp(cfg);
    const db = fsMod.getFirestore(app);
    fb = { fs: fsMod, db, ref: fsMod.doc(db, 'warehouse', 'state') };
  }

  function showErr(e) {
    const box = document.getElementById('errbar');
    if (!box) return;
    const code = (e && (e.code || e.message)) ? String(e.code || e.message) : '';
    let why = 'مشكلة في الاتصال بالسيرفر.', fix = 'اتأكد إن الموبايل متصل بالإنترنت وجرّب تاني.';
    if (code.indexOf('permission-denied') > -1 || code.indexOf('insufficient') > -1) {
      why = 'Firestore رافض القراءة والكتابة — قواعد الأمان (Rules) مقفولة.';
      fix = 'من صفحة Firestore ← تبويب Rules، غيّر allow read, write: if false إلى if true وادوس Publish.';
    } else if (code.indexOf('unavailable') > -1 || code.indexOf('network') > -1) {
      why = 'مفيش وصول لسيرفر Firestore.';
      fix = 'اتأكد من الإنترنت، ولو الملف مفتوح جوه تطبيق تاني جرّب تفتحه في متصفح عادي.';
    } else if (code.indexOf('not-found') > -1 || code.indexOf('NOT_FOUND') > -1) {
      why = 'قاعدة البيانات مش موجودة في المشروع ده.';
      fix = 'من Firebase ← Firestore Database ← Create database واختار Start in test mode.';
    } else if (code.indexOf('invalid-api-key') > -1 || code.indexOf('api-key') > -1 || code.indexOf('400') > -1) {
      why = 'بيانات الربط مرفوضة.';
      fix = 'افتح تبويب الأصناف والمناطق ← تعديل إعدادات Firebase والصق البلوك من صفحة Firebase.';
    }
    box.innerHTML = '<b>' + esc(why) + '</b>' + esc(fix) + (code ? '<br><code>' + esc(code) + '</code>' : '');
  }

  function conn(state, msg) {
    online = state === 'on';
    const el = document.getElementById('conn');
    if (el) {
      el.className = 'conn ' + (state === 'on' ? 'ok' : state === 'wait' ? 'wait' : 'bad');
      el.textContent = state === 'on' ? 'متصل بالسيرفر' : state === 'wait' ? 'جاري الاتصال…' : 'غير متصل';
      el.title = msg || '';
    }
  }

  /* اشتراك مباشر: أي تعديل من أي جهاز بيتحدّث هنا فورًا */
  function subscribe() {
    fb.fs.onSnapshot(fb.ref, async (snap) => {
      document.getElementById('errbar').innerHTML = '';
      if (!snap.exists()) { S = blank(); baseV = -1; conn('on'); await save(); render(); return; }
      const d = snap.data();
      baseV = d.v || 0;
      try { S = JSON.parse(d.json); } catch (e) { return; }
      conn('on');
      safeRender();
    }, (err) => { conn('off', err.message); showErr(err); });
  }

  /* منع إعادة الرسم والمستخدم بيكتب في خانة */
  function safeRender() {
    const a = document.activeElement;
    if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.closest('#view')) return;
    render();
  }

  /* الحفظ بقفل تفاؤلي: لو جهاز تاني عدّل قبلك، الحفظ بيترفض بدل ما يمسح شغله */
  async function save() {
    if (!fb) return;
    const payload = JSON.stringify(S), from = baseV;
    try {
      await fb.fs.runTransaction(fb.db, async (tx) => {
        const snap = await tx.get(fb.ref);
        const rv = snap.exists() ? (snap.data().v || 0) : -1;
        if (snap.exists() && rv !== from) throw new Error('CONFLICT');
        tx.set(fb.ref, { json: payload, v: from + 1, at: Date.now() });
      });
      baseV = from + 1;
      conn('on');
    } catch (e) {
      if (String(e.message).indexOf('CONFLICT') > -1) toast('في جهاز تاني عدّل نفس اللحظة — الشاشة اتحدثت، أعِد العملية.');
      else { conn('off', String(e.message)); showErr(e); toast('تعذر الحفظ على السيرفر — شوف التفاصيل فوق.'); }
    }
  }

  /* شاشة الإعداد أول مرة */
  function setupScreen(err) {
    document.querySelector('.tabs').style.display = 'none';
    view.innerHTML = '<div class="card"><h2>ربط قاعدة البيانات (Firebase)</h2>'
      + '<div class="hint">النظام بيحفظ كل البيانات على Firebase عشان تفتحه من أي موبايل وتلاقي نفس الأرصدة. الصق بيانات مشروعك مرة واحدة.</div>'
      + (err ? '<div class="warnbox">' + esc(err) + '</div>' : '')
      + '<ol style="font-size:13px;color:var(--ink-soft);padding-right:18px;margin:0 0 14px">'
      + '<li>افتح console.firebase.google.com واعمل مشروع جديد.</li>'
      + '<li>من Build اختار Firestore Database ← Create database.</li>'
      + '<li>من إعدادات المشروع ← Your apps ← أيقونة الويب &lt;/&gt; وسجّل تطبيق.</li>'
      + '<li>انسخ محتوى firebaseConfig والصقه تحت.</li></ol>'
      + '<textarea id="cfgTxt" rows="9" placeholder=\'{ "apiKey": "…", "authDomain": "…", "projectId": "…", "appId": "…" }\'></textarea>'
      + '<button class="btn accent" id="cfgSave" style="margin-top:12px">حفظ وتشغيل</button></div>';
    document.getElementById('cfgSave').addEventListener('click', () => {
      let t = document.getElementById('cfgTxt').value.trim();
      t = t.replace(/^[^{]*\{/, '{').replace(/\}[^}]*$/, '}');
      let cfg;
      try {
        cfg = JSON.parse(t.replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g, '$1"$2":').replace(/'/g, '"').replace(/,\s*}/g, '}'));
      } catch (e) { return toast('البيانات مش مقروءة — الصق الجزء اللي بين الأقواس { } كامل.'); }
      if (!cfg.projectId || !cfg.apiKey) return toast('ناقص apiKey أو projectId.');
      localStorage.setItem('wh:fbcfg', JSON.stringify(cfg));
      location.reload();
    });
  }

  function toast(m) {
    const t = $('#toast');
    t.innerHTML = '<div class="toast">' + esc(m) + '</div>';
    clearTimeout(toast._t); toast._t = setTimeout(() => { t.innerHTML = ''; }, 3200);
  }

  /* ===== حسابات ===== */
  const item = (id) => S.items.find(i => i.id === id) || {};
  const itemName = (id) => item(id).name || '—';
  const itemCode = (id) => item(id).code || '';
  const regionName = (id) => (S.regions.find(r => r.id === id) || {}).name || '—';
  const mainQty = (id) => n(S.main[id]);
  const regQty = (rid, id) => n((S.stock[rid] || {})[id]);
  const regTotal = (rid) => Object.values(S.stock[rid] || {}).reduce((a, b) => a + n(b), 0);
  const mainTotal = () => S.items.reduce((a, i) => a + mainQty(i.id), 0);
  const allRegTotal = () => S.regions.reduce((a, r) => a + regTotal(r.id), 0);
  const inRegions = (id) => S.regions.reduce((a, r) => a + regQty(r.id, id), 0);
  const filtered = () => { const t = q.trim().toLowerCase(); return t ? S.items.filter(i => (i.name + ' ' + i.code).toLowerCase().includes(t)) : S.items; };
  const byCode = (c) => S.items.find(i => i.code === String(c).trim());

  /* ===== العرض ===== */
  function render() {
    $('#hdMain').textContent = fmt(mainTotal());
    $('#hdReg').textContent = fmt(allRegTotal());
    $('#hdIt').textContent = fmt(S.items.length);
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    view.innerHTML = ({ dash: vDash, in: vIn, tr: vTr, sup: vSup, upd: vUpd, log: vLog, cfg: vCfg })[tab]();
    bind();
  }

  const searchBox = () => '<div style="margin-bottom:12px"><input id="q" placeholder="ابحث بالاسم أو الكود…" value="' + esc(q) + '"></div>';

  function vDash() {
    const list = filtered();
    const bars = list.length ? list.map(it => {
      const reg = inRegions(it.id), total = mainQty(it.id) + reg;
      const segs = total ? ['<div class="seg main" style="flex:' + mainQty(it.id) + '" title="المخزن الرئيسي"></div>']
        .concat(S.regions.filter(r => regQty(r.id, it.id) > 0).map(r => '<div class="seg" style="flex:' + regQty(r.id, it.id) + '" title="' + esc(r.name) + ': ' + fmt(regQty(r.id, it.id)) + '"></div>')).join('') : '';
      return '<div class="dist"><div class="dist-head"><div><b>' + esc(it.name) + '</b><code>' + esc(it.code) + '</code></div>'
        + '<span>الرئيسي <b class="num">' + fmt(mainQty(it.id)) + '</b> · المناطق <b class="num">' + fmt(reg) + '</b></span></div>'
        + '<div class="bar">' + segs + '</div></div>';
    }).join('') : '<div class="empty">مفيش أصناف مطابقة للبحث.</div>';

    const tiles = S.regions.map(r => {
      const lines = S.items.filter(i => regQty(r.id, i.id) > 0).map(i => esc(i.name) + ': <b class="num">' + fmt(regQty(r.id, i.id)) + '</b>').join(' · ');
      return '<div class="tile"><button class="tileBtn" data-open="' + r.id + '"><h3>' + esc(r.name) + ' <span class="go">تفاصيل ›</span></h3>'
        + '<div class="big">' + fmt(regTotal(r.id)) + '</div></button>'
        + '<small>' + (lines || 'لا يوجد رصيد') + '</small>'
        + '<div class="row-flex" style="gap:6px">'
        + '<button class="btn ghost mini" data-xls="' + r.id + '">إكسيل</button>'
        + '<button class="btn ghost mini" data-zero="' + r.id + '"' + (regTotal(r.id) ? '' : ' disabled') + '>تصفير الرصيد</button></div></div>';
    }).join('');

    return '<div class="card"><h2>أرصدة المناطق</h2>'
      + '<div class="hint">التصفير بيمسح رصيد المنطقة بس — رصيد المخزن الرئيسي مبيتأثرش، واللي اترحل يفضل مسجّل في السجل والتقارير.</div>'
      + '<div class="grid g3">' + tiles + '</div>'
      + '<div class="sep"></div><button class="btn danger" id="zeroAll"' + (allRegTotal() ? '' : ' disabled') + '>تصفير أرصدة كل المناطق</button></div>'
      + '<div class="card"><h2>توزيع الأصناف</h2><div class="hint">الشريط بيوضّح المتبقي في الرئيسي مقابل المرحّل للمناطق.</div>'
      + searchBox() + bars
      + '<div class="legend"><span class="dot" style="background:var(--indigo)"></span> المخزن الرئيسي'
      + ' <span class="dot" style="background:var(--signal);margin-right:12px"></span> المناطق</div></div>';
  }

  /* ===== شبكة إدخال الكميات — كل الأصناف قدامك وتكتب جنب اللي عايزه ===== */
  const draft = { tr: {}, in: {}, sup: {} };
  const gq = { tr: '', in: '', sup: '' };
  const gOnly = { tr: false, in: false, sup: false };
  let supMain = true;   // التزويدة: خصم من المخزن الرئيسي أم توريد مباشر
  let supRegion = null;

  const limited = (kind) => kind === 'tr' || (kind === 'sup' && supMain);

  function gridBlock(kind) {
    return '<div class="row-flex" style="margin-bottom:10px">'
      + '<div style="flex:1;min-width:140px"><input id="' + kind + 'Q" placeholder="فلترة بالاسم أو الكود…" value="' + esc(gq[kind]) + '" autocomplete="off"></div>'
      + '<button class="btn ghost mini" id="' + kind + 'Only">' + (gOnly[kind] ? 'كل الأصناف' : 'المُدخَل فقط') + '</button>'
      + '<button class="btn ghost mini" id="' + kind + 'Clear">مسح الكميات</button></div>'
      + '<div class="qbox" id="' + kind + 'List"></div>'
      + '<div class="sumbar" id="' + kind + 'Sum"></div>';
  }

  function drawGrid(kind) {
    const t = gq[kind].trim().toLowerCase();
    let list = S.items;
    if (t) list = list.filter(i => (i.name + ' ' + i.code).toLowerCase().includes(t));
    if (gOnly[kind]) list = list.filter(i => n(draft[kind][i.id]) > 0);
    const body = document.getElementById(kind + 'List');
    if (!body) return;
    body.innerHTML = list.length ? list.map(i => {
      const v = draft[kind][i.id];
      const av = mainQty(i.id);
      return '<div class="qrow' + (n(v) > 0 ? ' has' : '') + '" data-row="' + i.id + '">'
        + '<div class="qname"><b>' + esc(i.name) + '</b><span class="c">' + esc(i.code)
        + (limited(kind) ? ' · متاح ' + fmt(av) : ' · رصيد ' + fmt(av)) + '</span></div>'
        + '<input class="qin" data-k="' + kind + '" data-i="' + i.id + '" type="number" inputmode="decimal" min="0" step="any" placeholder="0" value="' + (v == null ? '' : v) + '"></div>';
    }).join('') : '<div class="empty">مفيش صنف مطابق.</div>';
    sumGrid(kind);
  }

  function sumGrid(kind) {
    const el = document.getElementById(kind + 'Sum');
    if (!el) return;
    const ids = Object.keys(draft[kind]).filter(k => n(draft[kind][k]) > 0);
    const tot = ids.reduce((a, k) => a + n(draft[kind][k]), 0);
    el.innerHTML = ids.length
      ? 'المُدخَل: <b class="num">' + ids.length + '</b> صنف · إجمالي <b class="num">' + fmt(tot) + '</b> وحدة'
      : 'اكتب الكمية جنب أي صنف — الأصناف اللي كميتها فاضية مش هتدخل في العملية.';
  }

  function bindGrid(kind) {
    const body = document.getElementById(kind + 'List');
    if (!body) return;
    body.addEventListener('input', (e) => {
      const el = e.target;
      if (!el.classList.contains('qin')) return;
      const id = el.dataset.i;
      let v = n(el.value);
      if (limited(kind) && v > mainQty(id)) { v = mainQty(id); el.value = v || ''; toast('المتاح من ' + itemName(id) + ' هو ' + fmt(mainQty(id)) + ' بس.'); }
      if (el.value === '' || v <= 0) delete draft[kind][id]; else draft[kind][id] = v;
      el.closest('.qrow').classList.toggle('has', v > 0);
      sumGrid(kind);
    });
    const qEl = document.getElementById(kind + 'Q');
    if (qEl) qEl.addEventListener('input', (e) => { gq[kind] = e.target.value; drawGrid(kind); });
    const oEl = document.getElementById(kind + 'Only');
    if (oEl) oEl.addEventListener('click', () => { gOnly[kind] = !gOnly[kind]; render(); });
    const cEl = document.getElementById(kind + 'Clear');
    if (cEl) cEl.addEventListener('click', () => { draft[kind] = {}; gOnly[kind] = false; render(); toast('اتمسحت الكميات.'); });
    drawGrid(kind);
  }

  const draftLines = (kind) => Object.keys(draft[kind]).filter(k => n(draft[kind][k]) > 0).map(k => ({ itemId: k, qty: n(draft[kind][k]) }));

  function vIn() {
    return '<div class="card"><h2>تسجيل وارد للمخزن الرئيسي</h2>'
      + '<div class="hint">اكتب الكمية الواردة جنب كل صنف مباشرة — الكميات دي بتتضاف فوق الرصيد الحالي.</div>'
      + '<div class="grid g2">'
      + '<div><label>التاريخ</label><input id="inDate" type="date" value="' + today() + '"></div>'
      + '<div><label>رقم الإذن / المورد</label><input id="inRef" placeholder="اختياري"></div>'
      + '<div><label>ملاحظات</label><input id="inNote" placeholder="اختياري"></div></div>'
      + '<div class="sep"></div>' + gridBlock('in')
      + '<button class="btn accent" id="doIn" style="margin-top:12px">تسجيل الوارد</button></div>'
      + '<div class="card"><h2>لصق الوارد دفعة واحدة</h2>'
      + '<div class="hint">الصق: كود الصنف ثم الكمية — سطر لكل صنف. الكميات هتتحط في الجدول فوق قبل التسجيل.</div>'
      + '<textarea id="inBulk" rows="4" placeholder="31010081&#9;50&#10;31025014&#9;120"></textarea>'
      + '<button class="btn ghost" id="inBulkAdd" style="margin-top:10px">تعبئة الكميات</button></div>';
  }

  function vTr() {
    const ropts = S.regions.map(r => '<option value="' + r.id + '">' + esc(r.name) + '</option>').join('');
    return '<div class="card"><h2>ترحيل من المخزن الرئيسي إلى منطقة</h2>'
      + '<div class="hint">اختار المنطقة، وبعدين اكتب الكمية جنب كل صنف عايز ترحّله. النظام مبيخلّيكش تتخطى المتاح.</div>'
      + '<div class="grid g2">'
      + '<div><label>المنطقة</label><select id="trRegion">' + ropts + '</select></div>'
      + '<div><label>التاريخ</label><input id="trDate" type="date" value="' + today() + '"></div>'
      + '<div><label>رقم إذن الصرف</label><input id="trRef" placeholder="اختياري"></div>'
      + '<div><label>ملاحظات</label><input id="trNote" placeholder="اختياري"></div></div>'
      + '<div class="sep"></div>' + gridBlock('tr')
      + '<button class="btn accent" id="doTr" style="margin-top:12px">تنفيذ الترحيل</button></div>'
      + '<div class="card"><h2>لصق سطور الترحيل دفعة واحدة</h2>'
      + '<div class="hint">الصق: كود الصنف ثم الكمية — سطر لكل صنف. الكميات هتتحط في الجدول فوق قبل التنفيذ.</div>'
      + '<textarea id="trBulk" rows="4" placeholder="31010081&#9;50&#10;31025014&#9;120"></textarea>'
      + '<button class="btn ghost" id="trBulkAdd" style="margin-top:10px">تعبئة الكميات</button></div>';
  }

  function vSup() {
    const ropts = S.regions.map(r => '<option value="' + r.id + '"' + (supRegion === r.id ? ' selected' : '') + '>' + esc(r.name) + '</option>').join('');
    return '<div class="card"><h2>تزويدة منطقة</h2>'
      + '<div class="hint">زوّد أصناف أو كميات على منطقة موجود عندها رصيد بالفعل، أو ابدأ رصيد لصنف جديد عندها.</div>'
      + '<div class="grid g2">'
      + '<div><label>المنطقة</label><select id="supRegion">' + ropts + '</select></div>'
      + '<div><label>مصدر البضاعة</label><select id="supSrc">'
      + '<option value="main"' + (supMain ? ' selected' : '') + '>من المخزن الرئيسي (يتخصم منه)</option>'
      + '<option value="direct"' + (supMain ? '' : ' selected') + '>توريد مباشر للمنطقة (مش من الرئيسي)</option>'
      + '</select></div>'
      + '<div><label>التاريخ</label><input id="supDate" type="date" value="' + today() + '"></div>'
      + '<div><label>ملاحظات</label><input id="supNote" placeholder="اختياري"></div></div>'
      + (supMain ? '' : '<div class="warnbox" style="margin-top:12px">توريد مباشر: الكميات هتتضاف لرصيد المنطقة من غير ما تتخصم من المخزن الرئيسي.</div>')
      + '<div class="sep"></div>' + gridBlock('sup')
      + '<button class="btn accent" id="doSup" style="margin-top:12px">تنفيذ التزويدة</button></div>';
  }

  function vUpd() {
    return '<div class="card"><h2>تحديث رصيد المخزن الرئيسي بالنسخ واللصق</h2>'
      + '<div class="hint">الصق الجدول من الإكسيل مباشرة. النظام بيتعرّف على الكود من نفسه سواء كان الترتيب (الكمية، الاسم، الكود) زي ملفك أو (الكود، الاسم، الكمية).</div>'
      + '<div class="warnbox">مهم: الأرقام دي بتحل محل الرصيد الحالي بالكامل (جرد جديد)، مش بتتضاف عليه. لو عايز تضيف كمية وارد استخدم تبويب «إضافة وارد». أرصدة المناطق مش هتتأثر.</div>'
      + '<textarea id="updText" rows="12" placeholder="678&#9;كارنفاليتا فان 850مل&#9;31010081&#10;660&#9;كارنفاليتا فان شيكو 850 مل&#9;31010082"></textarea>'
      + '<div class="row-flex" style="margin-top:12px">'
      + '<div style="flex:1;min-width:150px"><label>التاريخ</label><input id="updDate" type="date" value="' + today() + '"></div>'
      + '<div style="flex:2;min-width:180px"><label>ملاحظة (مثال: جرد يوم كذا)</label><input id="updNote" placeholder="اختياري"></div></div>'
      + '<div class="row-flex" style="margin-top:12px">'
      + '<button class="btn ghost" id="updPreview">فحص البيانات</button>'
      + '<button class="btn accent" id="updApply">اعتماد الرصيد الجديد</button></div>'
      + '<div id="updOut"></div></div>';
  }

  function vLog() {
    const rows = S.moves.length ? S.moves.slice().reverse().map(m => {
      const lines = m.lines.slice(0, 6).map(l => esc(itemName(l.itemId)) + ' <b class="num">' + fmt(Math.abs(l.qty)) + '</b>').join(' · ')
        + (m.lines.length > 6 ? ' <span style="color:var(--ink-soft)">+' + (m.lines.length - 6) + ' صنف</span>' : '');
      const kind = m.type === 'in' ? '<span class="pill in">وارد</span>'
        : m.type === 'transfer' ? '<span class="pill out">ترحيل</span>'
        : m.type === 'supply' ? '<span class="pill in">تزويدة مباشرة</span>'
        : m.type === 'reset' ? '<span class="pill out">تصفير منطقة</span>'
        : '<span class="pill adj">تحديث جرد</span>';
      const where = m.type === 'transfer' || m.type === 'reset' || m.type === 'supply' ? esc(regionName(m.regionId)) : 'المخزن الرئيسي';
      return '<tr><td class="num">' + esc(m.ref || m.no) + '</td><td class="num">' + esc(m.date) + '</td><td>' + kind + '</td>'
        + '<td>' + where + '</td><td>' + lines + '</td><td>' + esc(m.note || '') + '</td>'
        + '<td><button class="btn ghost mini" data-undo="' + m.id + '">تراجع</button></td></tr>';

      + '<div class="card"><h2>إعادة ضبط</h2><div class="hint">رجوع لبيانات ملف المخزن الأصلي ومسح كل الحركات والأرصدة.</div>'
      + '<div class="row-flex"><button class="btn ghost" id="reset">إعادة الضبط بالكامل</button>'

  /* ===== تطبيق الحركات ===== */
  function applyMove(m, sign) {
    m.lines.forEach(l => {
      const qv = n(l.qty);
      if (m.type === 'in' || m.type === 'adjust') {
        S.main[l.itemId] = n(S.main[l.itemId]) + sign * qv;
      } else if (m.type === 'transfer') {
        S.main[l.itemId] = n(S.main[l.itemId]) - sign * qv;
        S.stock[m.regionId] = S.stock[m.regionId] || {};
        S.stock[m.regionId][l.itemId] = n(S.stock[m.regionId][l.itemId]) + sign * qv;
      } else if (m.type === 'supply') {
        S.stock[m.regionId] = S.stock[m.regionId] || {};
        S.stock[m.regionId][l.itemId] = n(S.stock[m.regionId][l.itemId]) + sign * qv;
      } else if (m.type === 'reset') {
        S.stock[m.regionId] = S.stock[m.regionId] || {};
        S.stock[m.regionId][l.itemId] = n(S.stock[m.regionId][l.itemId]) - sign * qv;
      }
    });
  }
  function zeroLines(rid) {
    const lines = S.items.filter(i => regQty(rid, i.id) > 0).map(i => ({ itemId: i.id, qty: regQty(rid, i.id) }));
    if (!lines.length) return false;
    logMove({ type: 'reset', date: today(), ref: '', note: 'تصفير رصيد بعد الترحيل', regionId: rid, lines });
    return true;
  }
  async function zeroRegion(rid) {
    if (!zeroLines(rid)) return toast('المنطقة مصفّرة بالفعل.');
    await save(); render(); toast('اتصفّر رصيد ' + regionName(rid) + ' — المخزن الرئيسي زي ما هو.');
  }

  function logMove(m) { m.id = uid('m'); m.no = S.seq++; S.moves.push(m); applyMove(m, 1); }

  /* ===== محلل النسخ واللصق ===== */
  function parseLines(text) {
    const out = [], bad = [];
    text.split('\n').map(s => s.trim()).filter(Boolean).forEach(line => {
      const parts = line.split(/[\t,،;]+|\s{2,}/).map(s => s.trim()).filter(Boolean);
      let tokens = parts.length > 1 ? parts : line.split(/\s+/);
      const codeTok = tokens.find(t => /^\d{6,}$/.test(t.replace(/[^\d]/g, '')) && t.replace(/[^\d]/g, '').length >= 6);
      const qtyTok = tokens.filter(t => t !== codeTok).find(t => /^-?[\d.,]+$/.test(t));
      if (!codeTok || qtyTok === undefined) { bad.push(line); return; }
      const it = byCode(codeTok.replace(/[^\d]/g, ''));
      const nameTok = tokens.filter(t => t !== codeTok && t !== qtyTok).join(' ').trim();
      out.push({ code: codeTok.replace(/[^\d]/g, ''), qty: n(qtyTok.replace(/,/g, '')), itemId: it ? it.id : null, name: nameTok });
    });
    return { out, bad };
  }

  /* ===== الأحداث ===== */
  function bind() {
    const on = (sel, ev, fn) => { const e = $(sel); if (e) e.addEventListener(ev, fn); };
    const keep = () => { const e = $('#q'); if (e) { e.focus(); e.setSelectionRange(e.value.length, e.value.length); } };

    on('#q', 'input', (e) => { q = e.target.value; render(); keep(); });

    if (tab === 'in') bindGrid('in');
    if (tab === 'tr') bindGrid('tr');
    if (tab === 'sup') {
      bindGrid('sup');
      on('#supSrc', 'change', (e) => { supMain = e.target.value === 'main'; supRegion = $('#supRegion').value; draft.sup = {}; render(); });
      on('#supRegion', 'change', (e) => { supRegion = e.target.value; });
    }

    on('#doSup', 'click', async () => {
      const lines = draftLines('sup');
      if (!lines.length) return toast('اكتب كمية جنب صنف واحد على الأقل.');
      const regionId = $('#supRegion').value;
      if (supMain) for (const l of lines) if (l.qty > mainQty(l.itemId)) return toast('رصيد ' + itemName(l.itemId) + ' مش كافي في الرئيسي.');
      logMove({ type: supMain ? 'transfer' : 'supply', date: $('#supDate').value || today(), ref: '',
                note: ($('#supNote').value.trim() || 'تزويدة') + (supMain ? '' : ' — توريد مباشر'), regionId, lines });
      draft.sup = {}; gOnly.sup = false; gq.sup = '';
      await save(); render(); toast('اتزوّدت ' + regionName(regionId) + ' بـ ' + lines.length + ' صنف.');
    });

    const fillFrom = (kind, textId) => {
      const { out, bad } = parseLines($('#' + textId).value);
      let ok = 0, unknown = 0;
      out.forEach(r => {
        if (!r.itemId) { unknown++; return; }
        if (r.qty <= 0) return;
        let v = r.qty;
        if (kind === 'tr' && v > mainQty(r.itemId)) v = mainQty(r.itemId);
        draft[kind][r.itemId] = v; ok++;
      });
      gOnly[kind] = true; render();
      toast('اتعبّت كميات ' + ok + ' صنف' + (unknown || bad.length ? ' — ' + (unknown + bad.length) + ' سطر متقراش.' : '.'));
    };
    on('#inBulkAdd', 'click', () => fillFrom('in', 'inBulk'));
    on('#trBulkAdd', 'click', () => fillFrom('tr', 'trBulk'));

    on('#doIn', 'click', async () => {
      const lines = draftLines('in');
      if (!lines.length) return toast('اكتب كمية جنب صنف واحد على الأقل.');
      logMove({ type: 'in', date: $('#inDate').value || today(), ref: $('#inRef').value.trim(), note: $('#inNote').value.trim(), regionId: null, lines });
      draft.in = {}; gOnly.in = false; gq.in = '';
      await save(); render(); toast('اتسجل وارد ' + lines.length + ' صنف.');
    });

    on('#doTr', 'click', async () => {
      const lines = draftLines('tr');
      if (!lines.length) return toast('اكتب كمية جنب صنف واحد على الأقل.');
      const regionId = $('#trRegion').value;
      for (const l of lines) if (l.qty > mainQty(l.itemId)) return toast('رصيد ' + itemName(l.itemId) + ' مش كافي.');
      logMove({ type: 'transfer', date: $('#trDate').value || today(), ref: $('#trRef').value.trim(), note: $('#trNote').value.trim(), regionId, lines });
      draft.tr = {}; gOnly.tr = false; gq.tr = '';
      await save(); render(); toast('تم ترحيل ' + lines.length + ' صنف إلى ' + regionName(regionId) + '.');
    });

    document.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => openRegion(b.dataset.open)));
    document.querySelectorAll('[data-xls]').forEach(b => b.addEventListener('click', () => xlsRegion(b.dataset.xls)));
    document.querySelectorAll('[data-zero]').forEach(b => b.addEventListener('click', () => zeroRegion(b.dataset.zero)));
    on('#zeroAll', 'click', async () => {
      for (const r of S.regions) zeroLines(r.id);
      await save(); render(); toast('اتصفّرت أرصدة كل المناطق. رصيد المخزن الرئيسي متغيّرش.');
    });

    /* تحديث الرصيد باللصق */
    function preview() {
      const { out, bad } = parseLines($('#updText').value);
      const known = out.filter(r => r.itemId), unknown = out.filter(r => !r.itemId);
      const rows = known.slice(0, 200).map(r => '<tr><td class="num">' + esc(r.code) + '</td><td>' + esc(itemName(r.itemId))
        + '</td><td class="num">' + fmt(mainQty(r.itemId)) + '</td><td class="num"><b>' + fmt(r.qty) + '</b></td></tr>').join('');
      $('#updOut').innerHTML = '<div class="sep"></div>'
        + '<div class="hint">اتقرا <b>' + out.length + '</b> سطر · معروف <b>' + known.length + '</b> · كود جديد <b>' + unknown.length + '</b>'
        + (bad.length ? ' · متقراش <b>' + bad.length + '</b>' : '') + '</div>'
        + (unknown.length ? '<div class="warnbox">أكواد مش موجودة وهتتضاف كأصناف جديدة: ' + unknown.slice(0, 8).map(u => esc(u.code)).join('، ') + (unknown.length > 8 ? ' …' : '') + '</div>' : '')
        + (bad.length ? '<div class="warnbox">سطور متقراش: ' + bad.slice(0, 3).map(esc).join(' | ') + '</div>' : '')
        + '<div class="tw"><table><thead><tr><th>الكود</th><th>الصنف</th><th>الرصيد الحالي</th><th>الرصيد الجديد</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
      return { out, bad };
    }
    on('#updPreview', 'click', preview);

    on('#updApply', 'click', async () => {
      const { out } = parseLines($('#updText').value);
      if (!out.length) return toast('الصق البيانات الأول.');
      const lines = [];
      out.forEach(r => {
        let id = r.itemId;
        if (!id) { id = 'i' + r.code; S.items.push({ id, code: r.code, name: r.name || ('صنف ' + r.code), unit: '' }); S.main[id] = 0; }
        const delta = r.qty - mainQty(id);
        if (delta !== 0) lines.push({ itemId: id, qty: delta });
      });
      if (!lines.length) { render(); return toast('الأرصدة زي ما هي، مفيش تغيير.'); }
      logMove({ type: 'adjust', date: $('#updDate').value || today(), ref: '', note: $('#updNote').value.trim() || 'تحديث جرد', regionId: null, lines });
      await save(); tab = 'in'; q = ''; render();
      toast('اتحدّث رصيد ' + lines.length + ' صنف. الإجمالي الجديد ' + fmt(mainTotal()) + '.');
    });

    /* تراجع */
    document.querySelectorAll('[data-undo]').forEach(b => b.addEventListener('click', async () => {
      const m = S.moves.find(x => x.id === b.dataset.undo); if (!m) return;
      if (m.type === 'transfer') {
        for (const l of m.lines) if (l.qty > regQty(m.regionId, l.itemId)) return toast('رصيد المنطقة اتغيّر، مينفعش التراجع.');
      } else if (m.type === 'supply') {
        for (const l of m.lines) if (l.qty > regQty(m.regionId, l.itemId)) return toast('رصيد المنطقة اتغيّر، مينفعش التراجع.');
      } else if (m.type === 'in') {
        for (const l of m.lines) if (l.qty > mainQty(l.itemId)) return toast('الكمية اتصرفت بالفعل، مينفعش التراجع.');
      } else if (m.type === 'adjust') {
        for (const l of m.lines) if (l.qty > 0 && l.qty > mainQty(l.itemId)) return toast('الرصيد اتغيّر بعد التحديث، مينفعش التراجع.');
      }
      applyMove(m, -1);
      S.moves = S.moves.filter(x => x.id !== m.id);
      await save(); render(); toast('اترجعت الحركة والأرصدة.');
    }));

    /* إعدادات */
    on('#addReg', 'click', async () => {
      const nm = $('#regName').value.trim(); if (!nm) return toast('اكتب اسم المنطقة.');
      S.regions.push({ id: uid('r'), name: nm }); await save(); render(); toast('اتضافت المنطقة.');
    });
    document.querySelectorAll('[data-dreg]').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.dreg;
      if (regTotal(id)) return toast('المنطقة عليها رصيد، صفّرها الأول.');
      S.regions = S.regions.filter(r => r.id !== id); delete S.stock[id]; await save(); render();
    }));
    document.querySelectorAll('[data-rn]').forEach(inp => inp.addEventListener('change', async () => {
      const r = S.regions.find(x => x.id === inp.dataset.rn);
      if (r) { r.name = inp.value.trim() || r.name; await save(); toast('اتحفظ الاسم.'); }
    }));
    on('#addItem', 'click', async () => {
      const code = $('#itCode').value.trim(), nm = $('#itName').value.trim();
      if (!code || !nm) return toast('اكتب الكود والاسم.');
      if (byCode(code)) return toast('الكود ده موجود بالفعل.');
      const id = 'i' + code;
      S.items.push({ id, code, name: nm, unit: '' }); S.main[id] = n($('#itQty').value);
      await save(); render(); toast('اتضاف الصنف.');
    });
    document.querySelectorAll('[data-ditem]').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.ditem;
      if (mainQty(id) || inRegions(id)) return toast('الصنف عليه رصيد، مينفعش يتحذف.');
      S.items = S.items.filter(i => i.id !== id); await save(); render();
    }));
    on('#editCfg', 'click', () => setupScreen(''));
    on('#bkExp', 'click', () => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' }));
      a.download = 'نسخة_المخزن_' + today() + '.json'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
      toast('اتنزلت النسخة الاحتياطية.');
    });
    on('#bkImp', 'change', (e) => {
      const f = e.target.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = async () => {
        try {
          const d = JSON.parse(rd.result);
          if (!d.items || !d.regions) throw 0;
          S = d; await save(); q = ''; render(); toast('اترجعت البيانات من النسخة.');
        } catch (err) { toast('الملف ده مش نسخة صحيحة.'); }
      };
      rd.readAsText(f);
    });
    on('#reset', 'click', async () => { S = blank(); draft.in = {}; draft.tr = {}; q = ''; await save(); render(); toast('رجعت البيانات الأصلية.'); });

    on('#xlTr', 'click', () => xls(false));
    on('#xlAll', 'click', () => xls(true));
  }

  /* ===== تصدير إكسيل ===== */
  function xlsRegion(rid) {
    if (typeof XLSX === 'undefined') return toast('مكتبة الإكسيل لسه بتحمّل، جرّب بعد ثانية.');
    const rows = [];
    S.moves.filter(m => (m.type === 'transfer' || m.type === 'supply') && m.regionId === rid).forEach(m => m.lines.forEach(l => rows.push({
      'التاريخ': m.date, 'المرجع': m.ref || m.no, 'النوع': m.type === 'supply' ? 'توريد مباشر' : 'من الرئيسي', 'كود الصنف': itemCode(l.itemId),
      'اسم الصنف': itemName(l.itemId), 'الكمية': n(l.qty), 'ملاحظات': m.note || ''
    })));
    if (!rows.length) return toast('مفيش تحويلات مسجلة على ' + regionName(rid) + '.');
    const agg = {};
    rows.forEach(r => { agg[r['كود الصنف']] = (agg[r['كود الصنف']] || 0) + r['الكمية']; });
    const sum = Object.keys(agg).map(c => {
      const it = byCode(c) || {};
      return { 'كود الصنف': c, 'اسم الصنف': it.name || '', 'إجمالي المرحّل': agg[c], 'الرصيد الحالي بالمنطقة': it.id ? regQty(rid, it.id) : 0 };
    });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sum), 'إجمالي الأصناف');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'تفاصيل الحركات');
    XLSX.writeFile(wb, 'تحويلات_' + regionName(rid).replace(/[\\/:*?"<>|]/g, '') + '_' + today() + '.xlsx');
    toast('تم تنزيل تحويلات ' + regionName(rid) + '.');
  }

  function xls(all) {
    if (typeof XLSX === 'undefined') return toast('مكتبة الإكسيل لسه بتحمّل، جرّب بعد ثانية.');
    const wb = XLSX.utils.book_new();
    const add = (rows, empty, name) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [empty]), name);

    const tr = [];
    S.moves.filter(m => m.type === 'transfer' || m.type === 'supply').forEach(m => m.lines.forEach(l => tr.push({
      'التاريخ': m.date, 'المرجع': m.ref || m.no, 'المنطقة': regionName(m.regionId),
      'كود الصنف': itemCode(l.itemId), 'اسم الصنف': itemName(l.itemId), 'الكمية': n(l.qty), 'ملاحظات': m.note || ''
    })));
    add(tr, { 'التاريخ': '', 'المرجع': '', 'المنطقة': '', 'كود الصنف': '', 'اسم الصنف': '', 'الكمية': '', 'ملاحظات': '' }, 'التحويلات');

    const pivot = S.items.map(i => {
      const row = { 'كود الصنف': i.code, 'اسم الصنف': i.name };
      let t = 0;
      S.regions.forEach(r => { const v = tr.filter(x => x['كود الصنف'] === i.code && x['المنطقة'] === r.name).reduce((a, x) => a + x['الكمية'], 0); row[r.name] = v; t += v; });
      row['إجمالي المرحّل'] = t; row['رصيد الرئيسي'] = mainQty(i.id);
      return row;
    });
    add(pivot, { 'كود الصنف': '' }, 'ملخص المرحّل لكل منطقة');

    if (all) {
      const ins = [];
      S.moves.filter(m => m.type === 'in').forEach(m => m.lines.forEach(l => ins.push({
        'التاريخ': m.date, 'المرجع': m.ref || m.no, 'كود الصنف': itemCode(l.itemId), 'اسم الصنف': itemName(l.itemId), 'الكمية': n(l.qty), 'ملاحظات': m.note || ''
      })));
      add(ins, { 'التاريخ': '', 'المرجع': '', 'كود الصنف': '', 'اسم الصنف': '', 'الكمية': '', 'ملاحظات': '' }, 'الوارد');

      const bal = S.items.map(i => {
        const row = { 'كود الصنف': i.code, 'اسم الصنف': i.name, 'المخزن الرئيسي': mainQty(i.id) };
        S.regions.forEach(r => row[r.name] = regQty(r.id, i.id));
        row['الإجمالي'] = mainQty(i.id) + inRegions(i.id);
        return row;
      });
      add(bal, { 'كود الصنف': '' }, 'الأرصدة الحالية');
    }

    XLSX.writeFile(wb, 'تقرير_المخزن_' + today() + '.xlsx');
    toast('تم تنزيل ملف الإكسيل.');
  }

  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; q = ''; render(); }));
  view.innerHTML = '<div class="card"><div class="empty">بيتم الاتصال بقاعدة البيانات…</div></div>';
  (async () => {
    const cfg = readCfg();
    if (!cfg) return setupScreen('');
    try { await initFirebase(cfg); subscribe(); }
    catch (e) { conn('off'); showErr(e); setupScreen('تعذر تحميل مكتبة Firebase: ' + e.message); }
  })();
})();
</script>
</body>
</html>
